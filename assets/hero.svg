<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00B7FF"/>
      <stop offset=".48" stop-color="#087BFF"/>
      <stop offset="1" stop-color="#2445FF"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263A59"/>
      <stop offset=".5" stop-color="#101827"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#087BFF" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#087BFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#087BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#178DFF" stroke-opacity=".085"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="460" rx="24"/></clipPath>
    <clipPath id="avatarCrop"><circle cx="954" cy="222" r="207"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#03050A"/>
    <rect width="1200" height="460" fill="url(#grid)"/>
    <ellipse cx="964" cy="228" rx="310" ry="300" fill="url(#aura)"/>

    <path d="M0 0H320L274 50H0V0Z" fill="#071426" stroke="#087BFF" stroke-opacity=".65"/>
    <path d="M0 50H180" stroke="#00A9FF" stroke-width="2"/>
    <text x="34" y="32" fill="#77D5FF" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" letter-spacing="2">WOODSKILLA // SYSTEM_01</text>

    <g opacity=".42">
      <path d="M48 94H91L104 81H170" stroke="#148CFF"/>
      <circle cx="48" cy="94" r="3" fill="#168FFF"/>
      <path d="M48 382H125L139 396H224" stroke="#148CFF"/>
      <circle cx="48" cy="382" r="3" fill="#168FFF"/>
    </g>

    <text x="56" y="126" fill="#8AA2BE" font-family="Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="1.6">NIKITA · FULL-STACK PRODUCT ENGINEER</text>
    <text x="52" y="213" fill="#F1F7FF" font-family="Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-3">BUILD. SHIP.</text>
    <text x="52" y="291" fill="url(#blue)" font-family="Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-3">OWN THE STACK.</text>

    <path d="M56 320H508" stroke="url(#blue)" stroke-width="3"/>
    <path d="M508 320L532 308" stroke="#087BFF" stroke-width="3"/>
    <text x="56" y="355" fill="#9EB0C5" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" letter-spacing="1">ARCHITECTURE / INTERFACE / BACKEND / OPS</text>

    <g transform="translate(56 384)">
      <rect width="124" height="30" rx="15" fill="#091526" stroke="#087BFF" stroke-opacity=".6"/>
      <circle cx="17" cy="15" r="4" fill="#08A9FF" filter="url(#glow)"/>
      <text x="30" y="20" fill="#D6E9FF" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700">MOSCOW UTC+3</text>
      <rect x="136" width="156" height="30" rx="15" fill="#091526" stroke="#087BFF" stroke-opacity=".6"/>
      <text x="153" y="20" fill="#D6E9FF" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700">OPEN TO BUILDS</text>
    </g>

    <!-- Original profile artwork, kept pixel-perfect and cropped inside the banner -->
    <circle cx="954" cy="222" r="214" fill="#087BFF" opacity=".16" filter="url(#softGlow)"/>
    <image href="avatar-wolf.png" x="739" y="7" width="430" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarCrop)"/>
    <circle cx="954" cy="222" r="207" stroke="#168FFF" stroke-opacity=".28"/>
    <path d="M954 7V24M954 420V437M739 222H756M1152 222H1169" stroke="#168FFF" stroke-opacity=".55"/>

  </g>
</svg>
